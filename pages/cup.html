<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Spelschema Cup</title>

  <link rel="stylesheet" href="../assets/css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body class="cup-page">
  <div data-banner-root data-page-key="cup" data-schedule-type="Spelschema Cup"></div>

  <div class="page">
    <div class="layout">
      <div class="main">
        <div class="plan-export" id="export-weekend">
          <div id="weekendCalendar"></div>
        </div>

        <div class="cup-controls-row no-export">
          <div class="cup-actions-inline">
            <button id="weekendExportPng">Exportera som bild</button>
            <button id="weekendClear">Rensa schema</button>
          </div>

          <p class="cup-hint">Dra i schemat för att skapa eller justera. 
            Dra direkt från sidopanelen för färger. Dubbelklicka på ett skapat lag för 
            att ändra namn, tryck DEL för att ta bort det.</p>
        </div>

      </div>

      <aside class="sidebar no-export">
        <div class="cup-sidebar-copy">Dra färger härifrån</div>
        <div id="teams"></div>
      </aside>

    </div>
  </div>

  <div class="event-modal" data-event-modal hidden>
    <div class="event-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
      <div class="event-modal__header">
        <h2 id="eventModalTitle" data-event-modal-title>Redigera aktivitet</h2>
        <button type="button" class="event-modal__icon-btn" data-event-modal-close aria-label="Stäng">×</button>
      </div>

      <form class="event-modal__form" data-event-modal-form>
        <div class="event-modal__fields">
          <label class="event-modal__field" data-field-wrap="title">
            <span>Namn</span>
            <input data-field="title" type="text" maxlength="80" required>
          </label>

          <label class="event-modal__field" data-field-wrap="startTime">
            <span>Starttid</span>
            <input data-field="startTime" type="time" required>
          </label>

          <label class="event-modal__field" data-field-wrap="endTime">
            <span>Sluttid</span>
            <input data-field="endTime" type="time" required>
          </label>
        </div>

        <p class="event-modal__status" data-event-modal-status aria-live="polite"></p>

        <div class="event-modal__actions">
          <button type="submit" class="is-primary">Spara</button>
          <button type="button" class="is-danger" data-event-modal-delete>Ta bort</button>
          <button type="button" data-event-modal-close>Avbryt</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/banner.js"></script>
  <script src="../assets/js/event-modal.js"></script>
  <script src="../assets/js/cup.js"></script>
</body>
</html>
