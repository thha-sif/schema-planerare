<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Träningsschema</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>

<body>
  <div data-banner-root data-page-key="training" data-schedule-type="Träningsschema"></div>

  <div class="page">
    <div class="layout">

      <div class="main">
        <button class="no-export legacy-toolbar-control" id="exportAllPdf">Exportera alla scheman (PDF)</button>

        <button class="no-export legacy-toolbar-control" id="exportJson">Exportera JSON</button>
        <label class="no-export legacy-toolbar-control" for="importJson" style="margin-left:10px; cursor:pointer;">
            Importera JSON
        </label>
        <input class="no-export" id="importJson" type="file" accept="application/json" style="display:none;">

        <div class="plan-export" id="export-calendarA">
          <h1>A-plan</h1>
          <div id="calendarA"></div>
        </div>
        <button class="reset-btn no-export legacy-toolbar-control" data-cal="calendarA">Återställ plan</button>
        <button class="copy-btn no-export legacy-toolbar-control" data-cal="calendarA">Kopiera plan</button>
        <button class="export-png no-export legacy-toolbar-control" data-cal="calendarA">Exportera PNG</button>
        <br><br>

        <div class="plan-export" id="export-calendarB">
          <h1>B-plan</h1>
          <div id="calendarB"></div>
        </div>
        <button class="reset-btn no-export legacy-toolbar-control" data-cal="calendarB">Återställ plan</button>
        <button class="copy-btn no-export legacy-toolbar-control" data-cal="calendarB">Kopiera plan</button>
        <button class="export-png no-export legacy-toolbar-control" data-cal="calendarB">Exportera PNG</button>
        <br><br>

        <div class="plan-export" id="export-calendarS">
          <h1>Skönvik</h1>
          <div id="calendarS"></div>
        </div>
        <button class="reset-btn no-export legacy-toolbar-control" data-cal="calendarS">Återställ plan</button>
        <button class="copy-btn no-export legacy-toolbar-control" data-cal="calendarS">Kopiera plan</button>
        <button class="export-png no-export legacy-toolbar-control" data-cal="calendarS">Exportera PNG</button>
        <br><br>

        <div class="plan-export" id="export-calendarF">
          <h1>Försäsong A-plan</h1>
          <div id="calendarF"></div>
        </div>
        <button class="reset-btn no-export legacy-toolbar-control" data-cal="calendarF">Återställ plan</button>
        <button class="copy-btn no-export legacy-toolbar-control" data-cal="calendarF">Kopiera plan</button>
        <button class="export-png no-export legacy-toolbar-control" data-cal="calendarF">Exportera PNG</button>
        <br><br>

      </div>
      <aside class="sidebar no-export">
        <div id="teams"></div>
      </aside>

    </div>
  </div>

  <div class="event-modal" data-event-modal hidden>
    <div class="event-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
      <div class="event-modal__header">
        <h2 id="eventModalTitle" data-event-modal-title>Redigera aktivitet</h2>
        <button type="button" class="event-modal__icon-btn" data-event-modal-close aria-label="Stäng">×</button>
      </div>

      <form class="event-modal__form" data-event-modal-form>
        <div class="event-modal__fields">
          <label class="event-modal__field" data-field-wrap="title">
            <span>Namn</span>
            <input data-field="title" type="text" maxlength="80" required>
          </label>

          <label class="event-modal__field" data-field-wrap="startTime">
            <span>Starttid</span>
            <input data-field="startTime" type="time" required>
          </label>

          <label class="event-modal__field" data-field-wrap="endTime">
            <span>Sluttid</span>
            <input data-field="endTime" type="time" required>
          </label>
        </div>

        <p class="event-modal__status" data-event-modal-status aria-live="polite"></p>

        <div class="event-modal__actions">
          <button type="submit" class="is-primary">Spara</button>
          <button type="button" class="is-danger" data-event-modal-delete>Ta bort</button>
          <button type="button" data-event-modal-close>Avbryt</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/banner.js"></script>
  <script src="assets/js/history.js"></script>
  <script src="assets/js/event-modal.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
